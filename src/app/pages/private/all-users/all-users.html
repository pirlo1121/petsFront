<section class="users">
    <div class="users__header">
        <h1 class="users__title">Usuarios</h1>
        <span class="users__count"> {{users().length}} usuarios </span>
    </div>

    <div class="users__table-wrapper">
        <table class="users__table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th class="users__actions-col">Acciones</th>
                </tr>
            </thead>
            <tbody>
                @for (u of users(); track $index) {
                    <tr>
                        <td>
                            <div class="user">
                                <span class="user__avatar">{{ u.name.charAt(0) }}</span>
                                <span class="user__name">{{ u.name }}</span>
                            </div>
                        </td>
                        <td>{{ u.email }}</td>
                        <td>
                            <span class="badge" [class.badge--admin]="u.role === 'admin'" [class.badge--user]="u.role !== 'admin'">
                                {{ u.role }}
                            </span>
                        </td>
                        <td class="users__actions-col">
                            <button class="btn btn--primary" type="button" (click)="changeRole(u._id ,u.role )" >Cambiar role</button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</section>

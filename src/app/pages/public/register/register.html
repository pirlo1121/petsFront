<section class="container container--narrow">
    <form class="card form-card" (ngSubmit)="register()">
        <h1>Registrate</h1>

        <div class="field">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="shakira" name="name" [(ngModel)]="name">
        </div>

        <div class="field">
            <label for="lastName">lastName:</label>
            <input type="text" id="lastName" placeholder="shakira" name="lastName" [(ngModel)]="lastName">
        </div>

        <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="example@gmail.com" name="email" [(ngModel)]="email">
        </div>

        <div class="field">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="*******" name="password" [(ngModel)]="password">
        </div>

        <button class="btn btn--primary btn--block" type="submit">Registrate</button>
    </form>
</section>

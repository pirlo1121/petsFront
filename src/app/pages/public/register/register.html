<form (ngSubmit)="register()">
    <h1>Registrate</h1>

    <div class="field">
        <label for="name"> Name: </label>
        <input type="name" id="name" placeholder="shakira" name="name" [(ngModel)]="name" >
    </div>

    <div class="field">
        <label for="lastName"> lastName: </label>
        <input type="lastName" id="lastName" placeholder="shakira" name="lastName" [(ngModel)]="lastName" >
    </div>

    <div class="field">
        <label for="email"> Email: </label>
        <input type="email" id="email" placeholder="example@gmail.com" name="email" [(ngModel)]="email" >
    </div>

    <div class="field">
        <label for="password"> Password:</label>
        <input type="password" id="password" placeholder="*******" name="password" [(ngModel)]="password">
    </div>

    <div class="field">
        <label for="ciudad"></label>
        <select name="ciudad" id="ciudad" [(ngModel)]="ciudad">
            <option value="bogota">bogota</option>
            <option value="medellin">medellin</option>
            <option value="cali">cali</option>
        </select>
    </div>


    <button type="submit">Registrate</button>
</form>

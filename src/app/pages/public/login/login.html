<form (ngSubmit)="login()">
    <h1>LOGIN</h1>
    <div class="field">
        <label for="email"> Email: </label>
        <input type="email" id="email" placeholder="example@gmail.com" name="email" [(ngModel)]="email" >
    </div>

    <div class="field">
        <label for="password"> Password:</label>
        <input type="password" id="password" placeholder="*******" name="password" [(ngModel)]="password">
    </div>


    <button type="submit">Login</button>
</form>
